name: Pull Request Auto-Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ "main", "feature/**" ]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - name: Run PR Labeler
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true